
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-store-gitops
  namespace: gitops-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: smart-store-gitops
  template:
    metadata:
      labels:
        app: smart-store-gitops
    spec:
      containers:
        - name: smart-store
          image: smart-canary:2.0.0
          imagePullPolicy: Never
          ports:
            - containerPort: 80
